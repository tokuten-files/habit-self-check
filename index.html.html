<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>習慣セルフチェック</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#26312e;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif;line-height:1.7}.wrap{max-width:760px;margin:auto;padding:22px 14px 42px}.hero,.card{background:#fff;border:1px solid #e1e8e4;border-radius:18px;padding:20px;margin:14px 0}.hero{background:linear-gradient(135deg,#e6f1ed,#f7f1e7);padding:26px 22px}.eyebrow,.tag{color:#35675a;font-size:12px;font-weight:bold;letter-spacing:.08em}h1{font-size:32px;line-height:1.3;margin:8px 0}h2{font-size:23px;margin:0 0 12px}h3{font-size:18px;margin:0 0 8px}.muted{color:#68736e;font-size:13px}.primary,button{font:inherit;font-weight:bold;border:0;border-radius:12px;padding:13px 16px;cursor:pointer}.primary{background:#35675a;color:white;width:100%;margin-top:12px}.secondary{background:#fff;border:1px solid #dce4e0;width:100%}.hidden{display:none!important}.qtop{display:flex;gap:10px;align-items:center}.num{background:#e6f1ed;color:#35675a;padding:3px 10px;border-radius:9px;font-weight:bold}.question{font-weight:bold;font-size:17px}.options{display:grid;gap:8px}.option{display:flex;gap:10px;align-items:center;border:1px solid #dfe6e2;border-radius:11px;padding:11px;cursor:pointer}.option:has(input:checked){background:#eaf3ef;border-color:#35675a}.option input{accent-color:#35675a;width:18px;height:18px}.progress{height:7px;background:#e8eeeb;border-radius:20px;overflow:hidden}.progress span{display:block;background:#35675a;height:100%;width:0}.row{display:flex;justify-content:space-between;font-size:13px;color:#68736e;margin-bottom:7px}.score{margin:14px 0}.scoretop{display:flex;justify-content:space-between;font-weight:bold}.bar{height:10px;background:#e9eeeb;border-radius:20px;overflow:hidden;margin-top:5px}.bar span{display:block;height:100%;background:#35675a}.pill{display:inline-block;background:#e6f1ed;color:#35675a;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold}.result{border-top:4px solid #35675a}.callout{background:#f7f0e4;border-color:#eadfc9}.error{display:none;color:#a22;font-weight:bold}.actions{display:grid;gap:9px;margin-top:16px}@media(min-width:560px){.options{grid-template-columns:1fr 1fr}.wrap{padding-top:34px}.card{padding:23px}}@media print{body{background:white}.wrap{padding:0}.actions,.footer{display:none}.card,.hero{break-inside:avoid}}
</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">HABIT SELF CHECK</div><h1>習慣セルフチェック</h1><p>「続けたいのに、なかなか続かない」そんな自分を責める前に、今の傾向を整理してみませんか？</p><p class="muted">全10問・約3分。正解・不正解はありません。今の自分に近い回答を選んでください。</p><button class="primary" id="start">診断をはじめる</button></section><form id="quiz" class="hidden"><section class="card"><div class="row"><span id="progtext">回答済み 0 / 10</span><span id="pct">0%</span></div><div class="progress"><span id="progbar"></span></div></section><div id="questions"></div><p id="error" class="error">未回答の質問があります。すべて回答してください。</p><button class="primary" type="submit">診断結果を見る</button></form><section id="results" class="hidden" aria-live="polite"></section><p class="footer muted">この診断は回答傾向を整理するセルフチェックです。医学的・心理学的な診断や、能力を科学的に測定する検査ではありません。</p></main><script>
const qs=[
['目的','やりたいことを決めるとき、自分がそれに取り組みたい理由をはっきり説明できる。'],
['目的','将来について考えるとき、これからどんな生活を送りたいか、自分なりのイメージがある。'],
['計画','仕事や家事の予定を立てるとき、勉強や運動など自分のために使う時間を先に決めている。'],
['計画','新しいことを始めるとき、最初から頑張りすぎず、今の生活で無理なくできる量にしている。'],
['行動','やろうと思っているのに面倒なとき、気が進まなくてもまず少しだけ取りかかれる。'],
['行動','帰宅後や休日にSNSや動画を見ている途中でも、やるべきことに切り替えられる。'],
['継続','決めたことができなかった翌日、一度できなかったことを引きずらず、また始められる。'],
['継続','頑張っても成果が見えないとき、すぐに結果が出なくても焦ってやめずに続けられる。'],
['計画','急な残業や予定変更があったとき、別の時間に取り組めるよう予定を組み直せる。'],
['継続','疲れがたまっているとき、いつもの量が難しければ量を減らして無理なく続けられる。']];
const choices=[['よくあてはまる',4],['ややあてはまる',3],['あまりあてはまらない',2],['あてはまらない',1]],dims=['目的','計画','行動','継続'];
const strong={
目的:{title:'目的を見つける力',desc:'自分が進みたい方向や、取り組む理由を考えられることが強みです。目的が明確になるほど、日々の努力にも意味を感じやすくなります。',good:['自分が大切にしたいことを考える','目標に向かう理由を言葉にする','理想の生活から今やることを考える'],tip:'「なぜ続けたいのか」と「実現したい生活」を一文ずつ書き、やる気が落ちたときに見返せるようにしましょう。'},
計画:{title:'計画を立てる力',desc:'やりたいことを時間や量を考えながら実行できることが強みです。生活の中に取り組む時間を組み込み、習慣の土台を作るのが得意です。',good:['やることの優先順位を決める','無理のないスケジュールを考える','予定変更に合わせて計画を調整する'],tip:'カレンダーに取り組む時間を先に確保しつつ、予定を詰め込みすぎないよう余白も残しましょう。'},
行動:{title:'行動に移す力',desc:'完璧な準備や高いモチベーションを待つより、実際に動いて前に進めることが強みです。',good:['やるべきことに着手する','小さな行動から始める','試しながら改善する'],tip:'教材を開く、運動着を出すなど、最初の動作を決めておきましょう。始めるハードルを低く保つのがポイントです。'},
継続:{title:'継続する力',desc:'うまくいかない日があっても、気持ちややり方を調整しながら積み上げられることが強みです。',good:['できなかった翌日に再開する','結果が出るまで焦らず取り組む','疲れたときに量を調整する'],tip:'続けられた日数だけでなく、再開できたことや無理なく調整できたことも記録しましょう。'}};
const weak={
目的:{title:'目的を見つけるところでつまずきやすい',desc:'何のために取り組むのかが曖昧だと、途中で必要性を感じにくくなることがあります。',steps:['「なぜやりたいのか」を一文で書く。例：「将来の選択肢を増やし、自分で働き方を選べるようになりたい」。','理想の生活を3つ書く。働き方、自由に使える時間、大切な人との過ごし方など、実現したい場面を具体的にします。','週に一度、5分だけ目的を見直す。「今週の行動は理想の生活に近づくものだったか」を振り返りましょう。']},
計画:{title:'計画を立てるところでつまずきやすい',desc:'取り組む時間が決まっていなかったり、予定を詰め込みすぎたりすると、計画どおりに進まず負担になりやすい傾向があります。',steps:['取り組む時間を一つだけ先に確保する。「時間があれば」ではなく「夕食後20時30分から10分」のように決めます。','最初の目標を小さくする。30分の予定なら、まず10分から始め、余裕がある日に増やしましょう。','できなかったときの予備時間を決める。残業などで予定が崩れたら、別の時間に移すルールを作ります。']},
行動:{title:'行動に移すところでつまずきやすい',desc:'やるべきことが分かっていても、先延ばしやスマホなどで時間が過ぎ、始めるタイミングを逃しやすい傾向があります。',steps:['まず5分だけ取り組む。「1時間勉強」ではなく「教材を開いて1ページ読む」など、小さな行動から始めます。','スマホを手の届かない場所に置く。別の部屋やカバンの中に入れ、誘惑が目に入らない環境を作りましょう。','前日のうちに準備する。教材を机に置く、運動着を出すなど、すぐ始められる状態にしておきます。']},
継続:{title:'継続するところでつまずきやすい',desc:'一度できない日があるとやめてしまったり、成果が見えないと不安になったりすることがあります。',steps:['「休んでも翌日には戻る」と決める。できなかった分を取り返そうとせず、翌日に小さく再開します。','結果ではなく、取り組んだ事実を記録する。「今日は10分取り組めた」と記録し、積み重ねを見える形にします。','疲れた日の最低ラインを決める。普段30分なら1問だけ解くなど、負担を下げた方法を用意します。疲労が強い日は休息を優先しましょう。']}};
const msg={
'目的|計画':'目指したい未来を考える力は、あなたの武器です。次は、その思いを「いつ、何をするか」に落とし込みましょう。小さな予定を一つ決めるだけでも、行動が始まります。','目的|行動':'やりたい理由は、あなたの中にあります。今は大きく動こうとせず、まず5分だけ取り組んでみましょう。目的を思い出すことと、小さく始めることをセットにすると、一歩を踏み出しやすくなります。','目的|継続':'目指したい未来があることは大切な強みです。途中で止まっても自分を責めず、続けられなかった理由を見直して、もう一度小さく始めましょう。',
'計画|目的':'予定を立てる力があるあなたは、行動の土台を作れています。次は、その予定が自分の望む生活につながっているか確認しましょう。目的が明確になると、計画にも意味を感じやすくなります。','計画|行動':'やることを整理できるのは強みです。次は計画を立てたままにせず、最初の一歩を踏み出しましょう。予定の時間になったら教材を開くなど、最初の動作まで決めておきます。','計画|継続':'計画を組み立てる力は、習慣づくりに役立ちます。できなかった日があっても計画を捨てず、予備の時間や疲れた日の最低ラインを用意して、続け方を立て直しましょう。',
'行動|目的':'すぐに動けることは大きな強みです。次は、行動の方向を定めましょう。「この行動でどんな生活に近づきたいのか」を考えると、努力を望む未来につなげやすくなります。','行動|計画':'動き出せる力があるあなたは、実践しながら学ぶことが得意です。次は取り組む時間を先に確保しましょう。生活の中に時間を作ることで、安定して取り組みやすくなります。','行動|継続':'最初の一歩を踏み出せることは強みです。その行動を一度きりで終わらせず、続けられる形に整えましょう。できなかった翌日の再開方法を決めておくと、戻りやすくなります。',
'継続|目的':'コツコツ続けられる力があるあなたは、積み重ねを大切にできます。次は、その努力をどこにつなげたいのか明確にしましょう。理想を言葉にすると、続ける理由を見失いにくくなります。','継続|計画':'続ける力があるからこそ、頑張りすぎることもあるかもしれません。取り組む時間と量を先に決め、予定に余白を作ることも長く続けるための工夫です。','継続|行動':'続けようとする気持ちは強みです。始めるまでに時間がかかるときは、やる気を待つのではなく最初の動作を小さくしましょう。「5分だけ始める」と決めると、積み重ねる力を発揮しやすくなります。'};
const order=['目的','計画','行動','継続'];const $=s=>document.querySelector(s);
$('#questions').innerHTML=qs.map((q,i)=>`<section class="card"><div class="qtop"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="tag">${q[0]}の力</span></div><p class="question">${q[1]}</p><div class="options">${choices.map(c=>`<label class="option"><input type="radio" name="q${i}" value="${c[1]}"><span>${c[0]}</span></label>`).join('')}</div></section>`).join('');
function progress(){let n=qs.filter((q,i)=>$(`input[name=q${i}]:checked`)).length;$('#progtext').textContent=`回答済み ${n} / 10`,$('#pct').textContent=`${n*10}%`,$('#progbar').style.width=`${n*10}%`;$('#error').style.display='none'}$('#questions').addEventListener('change',progress);$('#start').onclick=()=>{$('#quiz').classList.remove('hidden');$('#quiz').scrollIntoView({behavior:'smooth'})};
function calculate(){let a=qs.map((q,i)=>+ $(`input[name=q${i}]:checked`).value),ix={目的:[0,1],計画:[2,3,8],行動:[4,5],継続:[6,7,9]},sc={};order.forEach(d=>{let ids=ix[d],sum=ids.reduce((t,i)=>t+a[i],0);sc[d]=Math.round((sum-ids.length)/(ids.length*3)*100)});let hi=[...order].sort((a,b)=>sc[b]-sc[a]||order.indexOf(a)-order.indexOf(b))[0],lo=[...order].sort((a,b)=>sc[a]-sc[b]||order.indexOf(b)-order.indexOf(a))[0];if(hi===lo)lo=[...order].filter(d=>d!==hi).sort((a,b)=>sc[a]-sc[b]||order.indexOf(b)-order.indexOf(a))[0];return{sc,hi,lo}}
function card(title,body,extra=''){return `<section class="card result ${extra}"><h3>${title}</h3>${body}</section>`}
$('#quiz').onsubmit=e=>{e.preventDefault();if(qs.some((q,i)=>!$(`input[name=q${i}]:checked`))){$('#error').style.display='block';return}let r=calculate(),s=r.sc,H=strong[r.hi],L=weak[r.lo];let scores=order.map(d=>`<div class="score"><div class="scoretop"><span>${d}</span><span>${s[d]}%</span></div><div class="bar"><span style="width:${s[d]}%"></span></div><div class="muted">${s[d]>=67?'今のあなたの得意な傾向':s[d]>=34?'伸ばしていけるポイント':'意識して整えたいポイント'}</div></div>`).join('');let html=`<div class="hero"><div class="eyebrow">YOUR RESULT</div><h2>診断結果</h2><p>今の自分を知ることが、習慣づくりの第一歩です。</p></div>${card('4つの力のバランス',`<div>${scores}</div><p class="muted">スコアは回答傾向を比較するための目安です。能力を科学的に測定した数値ではありません。</p>`)}${card('あなたの強み',`<span class="pill">あなたの強み</span><h2>${H.title}</h2><p>${H.desc}</p><p><b>得意なこと</b></p><ul>${H.good.map(x=>`<li>${x}</li>`).join('')}</ul><p><b>おすすめの活かし方</b></p><p>${H.tip}</p>`)}${card('挫折しやすいポイント',`<span class="pill">これから整えたいポイント</span><h2>${L.title}</h2><p>${L.desc}</p><p><b>今日からの解決策 3つ</b></p><ol>${L.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`)}${card('あなたの強みを活かすヒント',`<p>${msg[r.hi+'|'+r.lo]||`あなたの強み「${H.title}」を活かしながら、「${L.title}」を少しずつ整えていきましょう。まずは解決策から一つ選び、今日できる小さな行動に変えてみてください。`}</p>`)}${card('疲れた日の対処法','<ol><li><b>状態を確認する。</b>眠気や疲労が強い日は、無理に頑張らず休息を優先します。</li><li><b>できそうなら量を小さくする。</b>勉強なら5分、運動なら軽いストレッチなど、その日の状態に合わせます。</li><li><b>休むなら次のタイミングを決める。</b>「明日の夕食後に5分」のように再開の予定を具体的にします。</li></ol><p><b>習慣化は、毎日同じ量をこなすことではありません。</b>自分の状態に合わせて続け方を調整することも大切です。</p>')}${card('30日後に目指す姿','<ul><li><b>1週目：</b>今の生活に合う小さな習慣を決める</li><li><b>2週目：</b>日常の行動と習慣を結びつける</li><li><b>3週目：</b>忙しい日・疲れた日の続け方を調整する</li><li><b>4週目：</b>うまくいった方法を振り返り、翌月も続けられる形にする</li></ul><p>目指すのは完璧な毎日ではありません。ダラダラしてしまう日があっても、自分で切り替え、やりたいことに戻れる状態です。</p>')}${card('PDFのワークシートに記入しましょう',`<p>あなたの強み：<b>${r.hi}</b></p><p>挫折しやすいポイント：<b>${r.lo}</b></p><p class="muted">この結果を振り返り、今日から試すことを一つ決めてみてください。</p>`)}${card('結果がしっくりこない方へ','<p>診断だけでは分からない、生活環境や悩みもあると思います。</p><p>一人では整理しにくい方に向けて、<b>「無料で習慣のための現状棚卸コーチング」</b>も用意しています。今の状況を整理し、自分に合った習慣づくりの方向性を一緒に考えましょう。</p><p class="muted">公開前に、公式LINEや予約フォームのURLを追加してください。</p>','callout')}<div class="actions"><button class="primary" id="print">結果を印刷・PDF保存</button><button class="secondary" id="again">もう一度診断する</button></div>`;$('#results').innerHTML=html;$('#results').classList.remove('hidden');$('#quiz').classList.add('hidden');$('#results').scrollIntoView({behavior:'smooth'});$('#print').onclick=()=>window.print();$('#again').onclick=()=>{ $('#results').classList.add('hidden');$('#quiz').reset();$('#quiz').classList.remove('hidden');progress();window.scrollTo({top:0,behavior:'smooth'})}};
</script></body></html>
